name: CI

on:
  push:
    branches: [main]
  pull_request:

# The workflow only reads the repository.
permissions:
  contents: read

# A new push to the same branch cancels the run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The oldest supported version and the current LTS.
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # Includes the tests that open a real browser: ubuntu-latest ships with Google Chrome.
      - run: npm test
      - run: npm run build

      - name: Render the examples
        if: matrix.node == 24
        run: node dist/cli.js examples/*.md --out example-pdfs/

      - name: Attach the PDFs to this run
        if: matrix.node == 24
        uses: actions/upload-artifact@v7
        with:
          name: example-pdfs
          path: example-pdfs/
