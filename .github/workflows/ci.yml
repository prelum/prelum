name: CI

on:
  push:
    branches: [main]
  pull_request:

# The workflow only reads the repository.
permissions:
  contents: read

# A new push to the same branch cancels the run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The oldest supported version and the current LTS.
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

      # The pinned tests and the examples print with the Chromium build playwright-core expects,
      # not the runner's Chrome, which changes over time. Cached per playwright-core version.
      - name: Read the playwright-core version
        id: playwright
        run: echo "version=$(node -p "require('playwright-core/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      # A no-op when the cache already has it.
      - run: npx playwright-core install chromium

      # Includes the tests that open a real browser: the runner's Chrome, and the pinned Chromium.
      - run: npm test
      - run: npm run build

      - name: Render the examples
        if: matrix.node == 24
        # Stamp the commit's date, not the clock's: the same commit always prints the same PDFs.
        run: SOURCE_DATE_EPOCH=$(git log -1 --format=%ct) node dist/cli.js examples/*.md --out example-pdfs/ --pinned-browser

      - name: Attach the PDFs to this run
        if: matrix.node == 24
        uses: actions/upload-artifact@v7
        with:
          name: example-pdfs
          path: example-pdfs/
